name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-stub:
    # Dev-mode check: the app logic and UI run on Linux with the stub OCR engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v -rs
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # only used by the release step on tag pushes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Unit tests + Windows OCR smoke test
        run: python -m pytest -v -rs
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Self-test from source (real OCR + headless UI)
        shell: pwsh
        run: |
          python -m docdiff --selftest selftest-source.txt
          $code = $LASTEXITCODE
          Get-Content selftest-source.txt
          if ($code -ne 0) { exit 1 }

      - name: Build DocDiff.exe (PyInstaller, one-file, windowed)
        run: python tools/build_exe.py

      - name: Self-test the frozen DocDiff.exe (verifies winrt + Qt bundling)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\DocDiff.exe -ArgumentList "--selftest","selftest-exe.txt" -PassThru -Wait
          if (Test-Path selftest-exe.txt) { Get-Content selftest-exe.txt } else { Write-Host "no selftest output produced" }
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: DocDiff-windows-exe
          path: dist/DocDiff.exe
          if-no-files-found: error

      - name: Publish GitHub release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/DocDiff.exe --title "DocDiff $env:GITHUB_REF_NAME" --generate-notes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-logs
          path: selftest-*.txt
          if-no-files-found: ignore
